[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanjesh-system"
version = "2.0.0"
description = "Konkur (University Entrance Exam) registration, management, and analytics desktop application"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sanjesh Engineering Team" }]
dependencies = [
    "PySide6>=6.5.0",
    "SQLAlchemy>=2.0.0",
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "matplotlib>=3.6.0",
    "openpyxl>=3.0.0",
    "qrcode[pil]>=7.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
sanjesh = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]